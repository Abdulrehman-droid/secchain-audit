[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secchain-audit"
version = "1.0.0"
description = "Automated Program Analysis & Large-Scale Measurement Framework for Mobile & IoT Supply Chain Security"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
secchain = "secchain.cli:main"
